<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D - Máquina do Tempo</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
        }
        #ar-button {
            background-color: #ffffff;
            border-radius: 4px;
            border: none;
            position: absolute;
            bottom: 16px;
            right: 16px;
            padding: 10px 16px;
            font-size: 14px;
            color: #333333;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <model-viewer id="visor3d" 
                  ar 
                  ar-modes="webxr scene-viewer quick-look" 
                  camera-controls 
                  touch-action="pan-y" 
                  shadow-intensity="1" 
                  auto-rotate>
        <button slot="ar-button" id="ar-button">
            Ver no meu espaço (RA)
        </button>
    </model-viewer>

    <script>
        // 1. Captura o link enviado pelo FlutterFlow na URL
        const urlParams = new URLSearchParams(window.location.search);
        const modeloRecebido = urlParams.get('modelo');

        // 2. Localiza o visor 3D na tela
        const visor = document.getElementById('visor3d');

        if (modeloRecebido) {
            const urlLimpa = modeloRecebido.trim();

            // Se o link do FlutterFlow contiver "duck" ou "pato", força o carregamento correto do pato
            if (urlLimpa.toLowerCase().includes('duck') || urlLimpa.toLowerCase().includes('pato')) {
                visor.setAttribute('src', 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Duck/glTF-Binary/Duck.glb');
            } 
            // Se contiver "astronauta" ou "astronaut", carrega o astronauta
            else if (urlLimpa.toLowerCase().includes('astronaut')) {
                visor.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/Astronaut.glb');
            } 
            // Se for qualquer outro link direto vindo do Firebase, aplica diretamente
            else {
                visor.setAttribute('src', urlLimpa);
            }
        } else {
            // Padrão de segurança caso o link venha vazio por algum motivo
            visor.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/Astronaut.glb');
        }
    </script>
</body>
</html>
