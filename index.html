<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D - Máquina do Tempo</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.9.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f0f0f0; /* Fundo cinza claro para sabermos que a página abriu */
        }
        model-viewer {
            width: 100%;
            height: 100%;
        }
        #ar-button {
            background-color: #ffffff;
            border-radius: 4px;
            border: none;
            position: absolute;
            bottom: 16px;
            right: 16px;
            padding: 10px 16px;
            font-size: 14px;
            color: #333333;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <model-viewer id="visor3d" 
                  ar 
                  ar-modes="webxr scene-viewer quick-look" 
                  camera-controls 
                  touch-action="pan-y" 
                  shadow-intensity="1"
                  exposure="1"
                  environment-image="neutral"
                  auto-rotate>
        <button slot="ar-button" id="ar-button">
            Ver no meu espaço (RA)
        </button>
    </model-viewer>

    <script>
        function obterLinkModelo() {
            // Método ultra-seguro para pegar tudo o que vem depois de "?modelo="
            const query = window.location.search;
            if (!query) return null;
            
            const termo = "?modelo=";
            const indice = query.indexOf(termo);
            if (indice === -1) return null;
            
            // Recorta a string exatamente após o "=" do "?modelo="
            let resultado = query.substring(indice + termo.length);
            return resultado ? decodeURIComponent(resultado).trim() : null;
        }

        const visor = document.getElementById('visor3d');
        const urlDecodificada = obterLinkModelo();

        if (urlDecodificada) {
            // Palavras de atalho para testes rápidos direto na URL
            if (urlDecodificada.toLowerCase() === 'pato' || urlDecodificada.toLowerCase() === 'duck') {
                visor.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/shared-gltf/Duck.glb');
            } 
            else if (urlDecodificada.toLowerCase() === 'astronauta' || urlDecodificada.toLowerCase() === 'astronaut') {
                visor.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/Astronaut.glb');
            } 
            // Se for o link completo do Firebase ou do modelviewer, injeta direto
            else {
                visor.setAttribute('src', urlDecodificada);
            }
        } else {
            // Se o link vier totalmente sem o parâmetro "?modelo=", usa o astronauta como segurança
            visor.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/Astronaut.glb');
        }
    </script>
</body>
</html>
