<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D - Máquina do Tempo</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
        }
        #ar-button {
            background-color: #ffffff;
            border-radius: 4px;
            border: none;
            position: absolute;
            bottom: 16px;
            right: 16px;
            padding: 10px 16px;
            font-size: 14px;
            color: #333333;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <model-viewer id="visor3d" 
                  src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
                  ar 
                  ar-modes="webxr scene-viewer quick-look" 
                  camera-controls 
                  touch-action="pan-y" 
                  shadow-intensity="1" 
                  auto-rotate>
        <button slot="ar-button" id="ar-button">
            Ver no meu espaço (RA)
        </button>
    </model-viewer>

    <script>
        // Executa a troca do modelo assim que os elementos da página carregarem
        window.addEventListener('DOMContentLoaded', () => {
            const visor = document.getElementById('visor3d');
            
            // Pega o que está escrito depois de "?modelo=" de forma limpa e nativa
            const urlParams = new URLSearchParams(window.location.search);
            const modeloRecebido = urlParams.get('modelo');

            if (modeloRecebido && modeloRecebido.trim() !== "") {
                const linkLimpo = modeloRecebido.trim();

                // Se você digitar apenas "pato" ou "duck" para testar manualmente
                if (linkLimpo.toLowerCase() === 'pato' || linkLimpo.toLowerCase() === 'duck') {
                    visor.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/shared-gltf/Duck.glb');
                } 
                // Se for a URL completa enviada pelo Firebase/FlutterFlow, aplica ela direto
                else {
                    visor.setAttribute('src', linkLimpo);
                }
            }
        });
    </script>
</body>
</html>
