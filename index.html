<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D - Máquina do Tempo</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.9.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
        }
        #ar-button {
            background-color: #ffffff;
            border-radius: 4px;
            border: none;
            position: absolute;
            bottom: 16px;
            right: 16px;
            padding: 10px 16px;
            font-size: 14px;
            color: #333333;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <model-viewer id="visor3d" 
                  ar 
                  ar-modes="webxr scene-viewer quick-look" 
                  camera-controls 
                  touch-action="pan-y" 
                  shadow-intensity="1"
                  exposure="1"
                  environment-image="neutral"
                  auto-rotate>
        <button slot="ar-button" id="ar-button">
            Ver no meu espaço (RA)
        </button>
    </model-viewer>

    <script>
        function obterLinkModelo() {
            const query = window.location.search;
            if (!query) return null;
            
            const termo = "?modelo=";
            const indice = query.indexOf(termo);
            if (indice === -1) return null;
            
            // Recorta o link bruto exatamente após o "?modelo="
            let resultado = query.substring(indice + termo.length);
            return resultado ? decodeURIComponent(resultado).trim() : null;
        }

        const visor = document.getElementById('visor3d');
        const urlDecodificada = obterLinkModelo();

        // Links de servidores alternativos com CORS totalmente liberado e aberto
        const LINK_PATO_SEGURO = "https://raw.githubusercontent.com/google/model-viewer/master/packages/shared-assets/models/Duck.glb";
        const LINK_ASTRONAUTA_SEGURO = "https://modelviewer.dev/shared-assets/models/Astronaut.glb";

        if (urlDecodificada) {
            // Se a URL contiver a palavra "pato", "duck" ou o link bloqueado da KhronosGroup, desvia para o link seguro
            if (urlDecodificada.toLowerCase() === 'pato' || 
                urlDecodificada.toLowerCase() === 'duck' || 
                urlDecodificada.includes('KhronosGroup')) {
                visor.setAttribute('src', LINK_PATO_SEGURO);
            } 
            // Se contiver "astronauta" ou "astronaut"
            else if (urlDecodificada.toLowerCase() === 'astronauta' || 
                     urlDecodificada.toLowerCase() === 'astronaut' || 
                     urlDecodificada.includes('Astronaut.glb')) {
                visor.setAttribute('src', LINK_ASTRONAUTA_SEGURO);
            } 
            // Para quaisquer outros links diretos (como os seus futuros modelos reais do Firebase)
            else if (urlDecodificada !== '') {
                visor.setAttribute('src', urlDecodificada);
            } else {
                visor.setAttribute('src', LINK_ASTRONAUTA_SEGURO);
            }
        } else {
            visor.setAttribute('src', LINK_ASTRONAUTA_SEGURO);
        }
    </script>
</body>
</html>
