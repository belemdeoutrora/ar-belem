<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D - Máquina do Tempo</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }
        #container-3d {
            width: 100%;
            height: 100%;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
        }
        #ar-button {
            background-color: #ffffff;
            border-radius: 4px;
            border: none;
            position: absolute;
            bottom: 16px;
            right: 16px;
            padding: 10px 16px;
            font-size: 14px;
            color: #333333;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div id="container-3d"></div>

    <script>
        // 1. Captura a URL da barra de endereços de forma bruta
        const urlCompleta = window.location.href;
        
        // Modelo padrão de segurança caso o link venha sem parâmetros
        let modeloFinal = "https://modelviewer.dev/shared-assets/models/Astronaut.glb"; 

        if (urlCompleta.includes('modelo=')) {
            const partes = urlCompleta.split('modelo=');
            let linkBruto = partes[1];

            if (linkBruto) {
                // Decodifica os caracteres especiais (como %2F e %3A do Firebase)
                linkBruto = decodeURIComponent(linkBruto).trim();

                // Atalho rápido apenas caso você digite manualmente a palavra "astronauta"
                if (linkBruto.toLowerCase() === 'astronauta' || linkBruto.toLowerCase() === 'astronaut') {
                    modeloFinal = "https://modelviewer.dev/shared-assets/models/Astronaut.glb";
                }
                // Se for um link web completo (visto no Firebase ou GitHub), aplica direto
                else if (linkBruto.toLowerCase().startsWith('http')) {
                    modeloFinal = linkBruto;
                }
            }
        }

        // 2. Monta o visualizador de forma estática com o link correto injetado de primeira
        const container = document.getElementById('container-3d');
        container.innerHTML = `
            <model-viewer src="${modeloFinal}"
                          ar 
                          ar-modes="webxr scene-viewer quick-look" 
                          camera-controls 
                          touch-action="pan-y" 
                          shadow-intensity="1" 
                          auto-rotate>
                <button slot="ar-button" id="ar-button">
                    Ver no meu espaço (RA)
                </button>
            </model-viewer>
        `;
    </script>
</body>
</html>
