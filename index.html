<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D - Máquina do Tempo</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
        }
        #ar-button {
            background-color: #ffffff;
            border-radius: 4px;
            border: none;
            position: absolute;
            bottom: 16px;
            right: 16px;
            padding: 10px 16px;
            font-size: 14px;
            color: #333333;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <model-viewer id="visor3d" 
                  ar 
                  ar-modes="webxr scene-viewer quick-look" 
                  camera-controls 
                  touch-action="pan-y" 
                  shadow-intensity="1"
                  exposure="1"
                  auto-rotate>
        <button slot="ar-button" id="ar-button">
            Ver no meu espaço (RA)
        </button>
    </model-viewer>

    <script>
        // Executa o script apenas após a página estar totalmente carregada
        window.addEventListener('DOMContentLoaded', () => {
            const visor = document.getElementById('visor3d');
            
            // Usando o método nativo e estável do navegador para pegar parâmetros
            const parametros = new URLSearchParams(window.location.search);
            const modeloRecebido = parametros.get('modelo');

            // Links de teste 100% ativos e com CORS liberado
            const LINK_PATO = "https://modelviewer.dev/shared-assets/models/shared-gltf/Duck.glb";
            const LINK_ASTRONAUTA = "https://modelviewer.dev/shared-assets/models/Astronaut.glb";

            if (modeloRecebido && modeloRecebido.trim() !== '') {
                const termo = modeloRecebido.trim().toLowerCase();

                // Verificação simplificada por palavra-chave
                if (termo === 'pato' || termo === 'duck') {
                    visor.setAttribute('src', LINK_PATO);
                } 
                else if (termo === 'astronauta' || termo === 'astronaut') {
                    visor.setAttribute('src', LINK_ASTRONAUTA);
                } 
                // Se for a URL completa enviada pelo FlutterFlow ou Firebase
                else {
                    visor.setAttribute('src', modeloRecebido.trim());
                }
            } else {
                // Caso não encontre parâmetros, carrega o astronauta por segurança
                visor.setAttribute('src', LINK_ASTRONAUTA);
            }
        });
    </script>
</body>
</html>
