<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D - Máquina do Tempo</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
        }
        #ar-button {
            background-color: #ffffff;
            border-radius: 4px;
            border: none;
            position: absolute;
            bottom: 16px;
            right: 16px;
            padding: 10px 16px;
            font-size: 14px;
            color: #333333;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <model-viewer id="visor3d" 
                  ar 
                  ar-modes="webxr scene-viewer quick-look" 
                  camera-controls 
                  touch-action="pan-y" 
                  shadow-intensity="1" 
                  auto-rotate>
        <button slot="ar-button" id="ar-button">
            Ver no meu espaço (RA)
        </button>
    </model-viewer>

    <script>
        // 1. Captura o parâmetro '?modelo=' que o FlutterFlow envia
        const urlParams = new URLSearchParams(window.location.search);
        const modeloRecebido = urlParams.get('modelo');

        // 2. Mapeamento dos objetos 3D direto no código usando apelidos simples
        const modelosDisponiveis = {
            'cadeira': 'https://modelviewer.dev/shared-assets/models/Chair.glb',
            'astronauta': 'https://modelviewer.dev/shared-assets/models/Astronaut.glb'
        };

        // 3. Lógica de decisão de qual objeto carregar no visor
        if (modeloRecebido && modelosDisponiveis[modeloRecebido.toLowerCase()]) {
            // Se o FlutterFlow mandar 'cadeira' ou 'astronauta', carrega o link correspondente
            document.getElementById('visor3d').setAttribute('src', modelosDisponiveis[modeloRecebido.toLowerCase()]);
        } else if (modeloRecebido && (modeloRecebido.startsWith('http://') || modeloRecebido.startsWith('https://'))) {
            // Se você mandar um link completo de internet no futuro, ele também aceita!
            document.getElementById('visor3d').setAttribute('src', modeloRecebido);
        } else {
            // Caso dê algum erro ou venha vazio, o Astronauta entra como o plano B padrão
            document.getElementById('visor3d').setAttribute('src', modelosDisponiveis['astronauta']);
        }
    </script>
</body>
</html>
