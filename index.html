<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D - Máquina do Tempo</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
        }
        #ar-button {
            background-color: #ffffff;
            border-radius: 4px;
            border: none;
            position: absolute;
            bottom: 16px;
            right: 16px;
            padding: 10px 16px;
            font-size: 14px;
            color: #333333;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <model-viewer id="visor3d" 
                  src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
                  ar 
                  ar-modes="webxr scene-viewer quick-look" 
                  camera-controls 
                  touch-action="pan-y" 
                  shadow-intensity="1" 
                  auto-rotate>
        <button slot="ar-button" id="ar-button">
            Ver no meu espaço (RA)
        </button>
    </model-viewer>

    <script>
        // Método nativo e limpo para ler o link
        const urlParams = new URLSearchParams(window.location.search);
        const modeloRecebido = urlParams.get('modelo');
        const visor = document.getElementById('visor3d');

        // Se o utilizador enviou um link completo (do Firebase, por exemplo), injeta-o.
        // Se enviou apenas uma palavra simples (como 'pato'), mantém o Astronauta ativo para não quebrar.
        if (modeloRecebido && modeloRecebido.trim() !== "") {
            const link = modeloRecebido.trim();
            
            // Só altera o modelo se for um link web completo (começado por http)
            if (link.toLowerCase().startsWith("http")) {
                visor.setAttribute('src', link);
            }
        }
    </script>
</body>
</html>
