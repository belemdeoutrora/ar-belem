<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D - Máquina do Tempo</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
        }
        #ar-button {
            background-color: #ffffff;
            border-radius: 4px;
            border: none;
            position: absolute;
            bottom: 16px;
            right: 16px;
            padding: 10px 16px;
            font-size: 14px;
            color: #333333;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <model-viewer id="visor3d" 
                  ar 
                  ar-modes="webxr scene-viewer quick-look" 
                  camera-controls 
                  touch-action="pan-y" 
                  shadow-intensity="1" 
                  auto-rotate>
        <button slot="ar-button" id="ar-button">
            Ver no meu espaço (RA)
        </button>
    </model-viewer>

    <script>
        // 1. Captura o parâmetro '?modelo=' enviado pelo FlutterFlow
        const urlParams = new URLSearchParams(window.location.search);
        const modeloRecebido = urlParams.get('modelo');

        // 2. Links diretos e seguros guardados dentro do código
        const modelosDisponiveis = {
            'cadeira': 'https://modelviewer.dev/shared-assets/models/Chair.glb',
            'astronauta': 'https://modelviewer.dev/shared-assets/models/Astronaut.glb'
        };

        // 3. Verifica o que o FlutterFlow enviou
        if (modeloRecebido) {
            const termoLimpo = modeloRecebido.toLowerCase().trim();
            
            if (modelosDisponiveis[termoLimpo]) {
                // Se receber a palavra simples 'cadeira' ou 'astronauta', abre o link correto
                document.getElementById('visor3d').setAttribute('src', modelosDisponiveis[termoLimpo]);
            } else if (termoLimpo.includes('chair.glb')) {
                // Segurança extra: caso a URL inteira da cadeira venha colada no parâmetro
                document.getElementById('visor3d').setAttribute('src', modelosDisponiveis['cadeira']);
            } else if (termoLimpo.includes('astronaut.glb')) {
                // Segurança extra: caso a URL inteira do astronauta venha colada no parâmetro
                document.getElementById('visor3d').setAttribute('src', modelosDisponiveis['astronauta']);
            } else {
                // Se vier um texto desconhecido, usa a Cadeira como teste alternativo
                document.getElementById('visor3d').setAttribute('src', modelosDisponiveis['cadeira']);
            }
        } else {
            // Se o parâmetro vier vazio, usa o Astronauta como padrão
            document.getElementById('visor3d').setAttribute('src', modelosDisponiveis['astronauta']);
        }
    </script>
</body>
</html>
