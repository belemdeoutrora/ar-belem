<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D - Máquina do Tempo</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
        }
        #ar-button {
            background-color: #ffffff;
            border-radius: 4px;
            border: none;
            position: absolute;
            bottom: 16px;
            right: 16px;
            padding: 10px 16px;
            font-size: 14px;
            color: #333333;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <model-viewer id="visor3d" 
                  ar 
                  ar-modes="webxr scene-viewer quick-look" 
                  camera-controls 
                  touch-action="pan-y" 
                  shadow-intensity="1" 
                  auto-rotate>
        <button slot="ar-button" id="ar-button">
            Ver no meu espaço (RA)
        </button>
    </model-viewer>

    <script>
        // 1. Pegamos o link bruto direto da barra de endereço para o navegador não cortar as barras (//)
        const urlCompleta = window.location.href;
        
        // 2. Isolamos o que vem depois de "?modelo="
        const partes = urlCompleta.split('?modelo=');
        const visor = document.getElementById('visor3d');

        // Se houver algo depois do "?modelo="
        if (partes.length > 1) {
            // Pega o link do modelo e limpa espaços vazios
            const modeloRecebido = decodeURIComponent(partes[1]).trim();

            // Atalhos caso você digite apenas as palavras de teste
            if (modeloRecebido.toLowerCase() === 'pato' || modeloRecebido.toLowerCase() === 'duck') {
                visor.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/shared-gltf/Duck.glb');
            } 
            else if (modeloRecebido.toLowerCase() === 'astronauta' || modeloRecebido.toLowerCase() === 'astronaut') {
                visor.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/Astronaut.glb');
            } 
            // Se for um link completo (do Firebase ou outro site), injeta direto no visor
            else if (modeloRecebido !== '') {
                visor.setAttribute('src', modeloRecebido);
            } else {
                visor.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/Astronaut.glb');
            }
        } else {
            // Se o link vier sem o "?modelo=", usa o astronauta por segurança
            visor.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/Astronaut.glb');
        }
    </script>
</body>
</html>
