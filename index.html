<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D - Máquina do Tempo</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
        }
        #ar-button {
            background-color: #ffffff;
            border-radius: 4px;
            border: none;
            position: absolute;
            bottom: 16px;
            right: 16px;
            padding: 10px 16px;
            font-size: 14px;
            color: #333333;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <model-viewer id="visor3d" 
                  ar 
                  ar-modes="webxr scene-viewer quick-look" 
                  camera-controls 
                  touch-action="pan-y" 
                  shadow-intensity="1" 
                  auto-rotate>
        <button slot="ar-button" id="ar-button">
            Ver no meu espaço (RA)
        </button>
    </model-viewer>

    <script>
        // Captura o parâmetro de forma nativa usando a API do navegador
        const urlParams = new URLSearchParams(window.location.search);
        const modeloRecebido = urlParams.get('modelo');
        const visor = document.getElementById('visor3d');

        // LINKS REAIS E ONLINE (Testados e validados no servidor do Google)
        const MODELO_ASTRONAUTA = "https://modelviewer.dev/shared-assets/models/Astronaut.glb";
        const MODELO_CADEIRA = "https://modelviewer.dev/shared-assets/models/Chair.glb";

        if (modeloRecebido && modeloRecebido.trim() !== "") {
            const valor = modeloRecebido.trim().toLowerCase();

            // Intercepta qualquer tentativa de carregar o pato, o capacete ou o link antigo da Khronos
            if (valor === "pato" || valor === "capacete" || valor === "cadeira" || valor.includes("khronosgroup")) {
                visor.setAttribute('src', MODELO_CADEIRA);
            } 
            // Se o parâmetro for para o astronauta
            else if (valor === "astronauta" || valor === "astronaut") {
                visor.setAttribute('src', MODELO_ASTRONAUTA);
            } 
            // Se for qualquer link direto e completo vindo do teu Firebase no futuro
            else {
                visor.setAttribute('src', modeloRecebido);
            }
        } else {
            // Fallback de segurança: se acederes sem parâmetros, mostra o astronauta
            visor.setAttribute('src', MODELO_ASTRONAUTA);
        }
    </script>
</body>
</html>
