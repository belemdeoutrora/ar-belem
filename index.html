<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D - Máquina do Tempo</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }
        #container-3d {
            width: 100%;
            height: 100%;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
        }
        #ar-button {
            background-color: #ffffff;
            border-radius: 4px;
            border: none;
            position: absolute;
            bottom: 16px;
            right: 16px;
            padding: 10px 16px;
            font-size: 14px;
            color: #333333;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div id="container-3d"></div>

    <script>
        // 1. Descobre qual modelo foi solicitado lendo a URL de forma bruta
        const urlCompleta = window.location.href;
        let modeloFinal = "https://modelviewer.dev/shared-assets/models/Astronaut.glb"; // Padrão de segurança

        if (urlCompleta.includes('modelo=')) {
            const partes = urlCompleta.split('modelo=');
            let linkBruto = partes[1];

            if (linkBruto) {
                linkBruto = decodeURIComponent(linkBruto).trim();

                // Se o usuário digitou 'pato' ou 'duck'
                if (linkBruto.toLowerCase() === 'pato' || linkBruto.toLowerCase() === 'duck' || linkBruto.includes('Duck.glb')) {
                    modeloFinal = "https://modelviewer.dev/shared-assets/models/shared-gltf/Duck.glb";
                } 
                // Se for um link completo vindo direto do Firebase (começando com http)
                else if (linkBruto.toLowerCase().startsWith('http')) {
                    modeloFinal = linkBruto;
                }
            }
        }

        // 2. Cria e injeta a tag <model-viewer> inteira com o link definitivo fixado
        const container = document.getElementById('container-3d');
        container.innerHTML = `
            <model-viewer src="${modeloFinal}"
                          ar 
                          ar-modes="webxr scene-viewer quick-look" 
                          camera-controls 
                          touch-action="pan-y" 
                          shadow-intensity="1" 
                          auto-rotate>
                <button slot="ar-button" id="ar-button">
                    Ver no meu espaço (RA)
                </button>
            </model-viewer>
        `;
    </script>
</body>
</html>
