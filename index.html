<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D - Máquina do Tempo</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
        }
        #ar-button {
            background-color: #ffffff;
            border-radius: 4px;
            border: none;
            position: absolute;
            bottom: 16px;
            right: 16px;
            padding: 10px 16px;
            font-size: 14px;
            color: #333333;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <model-viewer id="visor3d" 
                  ar 
                  ar-modes="webxr scene-viewer quick-look" 
                  camera-controls 
                  touch-action="pan-y" 
                  shadow-intensity="1" 
                  auto-rotate>
        <button slot="ar-button" id="ar-button">
            Ver no meu espaço (RA)
        </button>
    </model-viewer>

    <script>
        // 1. Captura a URL atual da barra de endereços de forma segura
        const urlCompleta = window.location.href;
        const visor = document.getElementById('visor3d');

        // 2. Verifica se existe o termo "?modelo=" na URL
        if (urlCompleta.indexOf('?modelo=') !== -1) {
            
            // Separa o link do site do conteúdo do modelo
            const partes = urlCompleta.split('?modelo=');
            let modeloRecebido = partes[1];

            if (modeloRecebido) {
                // Decodifica caracteres como %2F e limpa espaços vazios nas pontas
                modeloRecebido = decodeURIComponent(modeloRecebido).trim();
                
                // Cria uma versão em minúsculo apenas para a checagem das palavras de teste
                const testePalavra = modeloRecebido.toLowerCase();

                if (testePalavra === 'pato' || testePalavra === 'duck') {
                    visor.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/shared-gltf/Duck.glb');
                } 
                else if (testePalavra === 'astronauta' || testePalavra === 'astronaut') {
                    visor.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/Astronaut.glb');
                } 
                // 3. Se for o link real do Firebase, injeta a URL bruta direto sem travar
                else if (modeloRecebido !== '') {
                    visor.setAttribute('src', modeloRecebido);
                } 
                else {
                    visor.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/Astronaut.glb');
                }
            } else {
                visor.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/Astronaut.glb');
            }

        } else {
            // Caso o link seja acessado puramente sem o "?modelo=", mostra o astronauta padrão
            visor.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/Astronaut.glb');
        }
    </script>
</body>
</html>
