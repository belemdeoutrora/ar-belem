<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D - Máquina do Tempo</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
        }
        #ar-button {
            background-color: #ffffff;
            border-radius: 4px;
            border: none;
            position: absolute;
            bottom: 16px;
            right: 16px;
            padding: 10px 16px;
            font-size: 14px;
            color: #333333;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <model-viewer id="visor3d" 
                  ar 
                  ar-modes="webxr scene-viewer quick-look" 
                  camera-controls 
                  touch-action="pan-y" 
                  shadow-intensity="1" 
                  auto-rotate>
        <button slot="ar-button" id="ar-button">
            Ver no meu espaço (RA)
        </button>
    </model-viewer>

    <script>
        // 1. Captura o texto bruto contido na URL do navegador
        const urlCompleta = window.location.href;
        
        // Split separa o link do seu site do link do modelo que vem após "?modelo="
        const partesUrl = urlCompleta.split('?modelo=');
        const visor = document.getElementById('visor3d');

        if (partesUrl.length > 1) {
            // 2. Extrai o link do modelo isolando-o de parâmetros adicionais se houverem
            let linkBruto = partesUrl[1].split('&')[0];
            
            // Decodifica os caracteres especiais de forma segura
            let urlDecodificada = decodeURIComponent(linkBruto).trim();

            // Atalhos caso seja digitado apenas termos simples direto no navegador
            if (urlDecodificada.toLowerCase() === 'pato' || urlDecodificada.toLowerCase() === 'duck') {
                visor.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/shared-gltf/Duck.glb');
            } 
            else if (urlDecodificada.toLowerCase() === 'astronauta' || urlDecodificada.toLowerCase() === 'astronaut') {
                visor.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/Astronaut.glb');
            } 
            // 3. Se for uma URL completa válida (Firebase ou GitHub), aplica direto no visor
            else if (urlDecodificada !== '') {
                visor.setAttribute('src', urlDecodificada);
            } else {
                visor.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/Astronaut.glb');
            }
        } else {
            // Fallback de segurança caso nenhum parâmetro seja enviado
            visor.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/Astronaut.glb');
        }
    </script>
</body>
</html>
