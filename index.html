<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D - Máquina do Tempo</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.9.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f0f0f0; /* Fundo cinza claro de segurança para os testes */
        }
        model-viewer {
            width: 100%;
            height: 100%;
        }
        #ar-button {
            background-color: #ffffff;
            border-radius: 4px;
            border: none;
            position: absolute;
            bottom: 16px;
            right: 16px;
            padding: 10px 16px;
            font-size: 14px;
            color: #333333;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <model-viewer id="visor3d" 
                  ar 
                  ar-modes="webxr scene-viewer quick-look" 
                  camera-controls 
                  touch-action="pan-y" 
                  shadow-intensity="1"
                  exposure="1"
                  environment-image="neutral"
                  auto-rotate>
        <button slot="ar-button" id="ar-button">
            Ver no meu espaço (RA)
        </button>
    </model-viewer>

    <script>
        // Captura a URL completa do navegador de forma bruta
        const urlCompleta = window.location.href;
        const partesUrl = urlCompleta.split('?modelo=');
        const visor = document.getElementById('visor3d');

        if (partesUrl.length > 1) {
            let linkBruto = partesUrl[1].split('&')[0];
            let urlDecodificada = decodeURIComponent(linkBruto).trim();

            // Atalhos para digitação manual no navegador
            if (urlDecodificada.toLowerCase() === 'pato' || urlDecodificada.toLowerCase() === 'duck') {
                visor.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/shared-gltf/Duck.glb');
            } 
            else if (urlDecodificada.toLowerCase() === 'astronauta' || urlDecodificada.toLowerCase() === 'astronaut') {
                visor.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/Astronaut.glb');
            } 
            // Se for um link completo (Firebase ou outro site)
            else if (urlDecodificada !== '') {
                visor.setAttribute('src', urlDecodificada);
            } else {
                // Se o link após o igual estiver vazio, mostra o astronauta
                visor.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/Astronaut.glb');
            }
        } else {
            // Se não tiver o parâmetro "?modelo=", mostra o astronauta
            visor.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/Astronaut.glb');
        }
    </script>
</body>
</html>
