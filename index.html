<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D - Máquina do Tempo</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
        }
        #ar-button {
            background-color: #ffffff;
            border-radius: 4px;
            border: none;
            position: absolute;
            bottom: 16px;
            right: 16px;
            padding: 10px 16px;
            font-size: 14px;
            color: #333333;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <model-viewer id="visor3d" 
                  src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
                  ar 
                  ar-modes="webxr scene-viewer quick-look" 
                  camera-controls 
                  touch-action="pan-y" 
                  shadow-intensity="1" 
                  auto-rotate>
        <button slot="ar-button" id="ar-button">
            Ver no meu espaço (RA)
        </button>
    </model-viewer>

    <script>
        // 1. Pega o texto inteiro que está escrito na barra de endereços do navegador
        const urlCompleta = window.location.href;
        const visor = document.getElementById('visor3d');

        // 2. Se dentro desse texto existir a palavra "modelo="
        if (urlCompleta.includes('modelo=')) {
            
            // Corta o texto e pega apenas o que está depois do sinal de "="
            const partes = urlCompleta.split('modelo=');
            let linkBruto = partes[1];

            if (linkBruto) {
                // Decodifica caracteres especiais e limpa espaços
                linkBruto = decodeURIComponent(linkBruto).trim();

                // Verifica se o usuário digitou apenas a palavra "pato" para testar
                if (linkBruto.toLowerCase() === 'pato' || linkBruto.toLowerCase() === 'duck') {
                    visor.setAttribute('src', 'https://modelviewer.dev/shared-assets/models/shared-gltf/Duck.glb');
                } 
                // Se for um link completo começando com http (Firebase/GitHub), injeta direto
                else if (linkBruto.toLowerCase().startsWith('http')) {
                    visor.setAttribute('src', linkBruto);
                }
            }
        }
    </script>
</body>
</html>
